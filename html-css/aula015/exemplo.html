<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
        }

        #caixa3 {
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="caixa1"></div>
        <div class="item" id="caixa2"></div>
        <div class="item" id="caixa3"></div>
    </div>
</body>
</html>
