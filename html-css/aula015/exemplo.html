<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
        }

        /*
        grid-row-start: 1;
        grid-column-start: 1;
        grid-row-end: span 3; 
        grid-column-end: span 2;
        */

        /* início / final
        grid-row: 1 / -1;
        grid-column: 1 / 3;
        */

        .caixa {
                    /* início / final */
            grid-area: 1 / 1 / -1 / 3;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="caixa1"></div>
        <div class="item" id="caixa2"></div>
        <div class="item" id="caixa3"></div>
    </div>
</body>
</html>
