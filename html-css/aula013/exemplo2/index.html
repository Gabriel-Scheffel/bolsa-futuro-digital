<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
            height: 400px;
            align-items: center;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        /*
        flex-start, flex-end, center, strech
        */
        div#i1 {
            order: 0;
            align-self: auto;
        }

        div#i2 {
            order: 0;
        }

        div#i3 {
            order: 0;
        }

        div#i4 {
            order: 0;
        }

        div#i5 {
            order: 0;
        }

        div#i6 {
            order: 0;
        }

        div#i7 {
            order: 0;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>

        <!-- Colocar order p/ mostrar
        <div class="item" style="order: -1;">D</div>
        
        <div class="item" style="order: 1;">F</div>
        -->
    </div>
</body>
</html>
