<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" value="M"> <label for="isxmas">Masculino</label>
            <input type="radio" name="sexo" id="isxfem" value="F"> <label for="isxfem">Feminino</label>
        </fieldset>

        <br><br><br>

        <fieldset>
            <legend>Linguagens</legend>
            <input type="checkbox" name="html" id="ihtml"> <label for="ihtml">HTML</label> <br>
            <input type="checkbox" name="css" id="icss"> <label for="icss">CSS</label> <br>
            <input type="checkbox" name="js" id="ijs"> <label for="ijs">JavaScript</label> <br>
            <input type="checkbox" name="python" id="ipython"> <label for="ipython">Python</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
