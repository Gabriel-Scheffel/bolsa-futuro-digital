<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid 03</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        div.container {
            border: 3px solid blue;
            display: grid;
            /*
            grid-template-rows: 50px 50px 50px
            grid-template-columns: auto auto auto (120px 120px 120px)
            */
            /* Mostrar 1fr, 2fr, 4fr */
            /* Diferença entre 1fr 4fr 1fr e repeat(2, 1fr) 4fr*/
            /* 100px 40% repeat(2, 1fr) */
            grid-template: repeat(3, 80px) / repeat(3, 120px);
            /* Adicionar depois */
            /* Adicionar mais itens! */
            grid-auto-flow: column;
            grid-auto-rows: 80px;      
            grid-auto-columns: 120px;
            /* ================ */
            place-items: normal normal;
            place-content: normal normal;
            gap: 10px;
        }

        /* Exemplo 2
        div.container {
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template: repeat(3, auto) / repeat(3, auto);
            place-items: start center;
            place-content: space-between end;
            gap: 10px;
        }
        */

        div.item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
