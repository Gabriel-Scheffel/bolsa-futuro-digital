<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid 02</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        div.container {
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template: repeat(3, auto) / repeat(3, auto);
            place-items: start center;
            place-content: space-between end;
            gap: 10px;
        }

        /*
        Exemplo 1
        div.container {
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template-columns: auto auto auto;  <-- fazer as simplificações
            grid-template-rows: auto auto auto;     <--/
            gap: 10px;
            align-items: normal;     <-- start          <--\
            justify-items: normal;   <-- center         <---fazer simplificações
            align-content: normal;   <-- space-between  <---fazer simplificações
            justify-content: normal; <-- end            <--/
        }
        */

        div.item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
    </div>
</body>
</html>
