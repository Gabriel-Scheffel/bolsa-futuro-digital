<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Testando JavaScript</h1>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quam, voluptatum? Eos rem earum alias delectus, aut unde repellendus iste reiciendis eum neque veniam deleniti. Tenetur ad quisquam nam quam ullam.</p>

    <script>
        // Os valores de a e b são digitados pelo usuário
        let a = window.prompt('Digite um número:')
        let b = window.prompt('Digite outro número:')
        // Antes de realizar a operação devemos tratar os dados
        let c = Number(a) + Number(b)
        // Usamos o alert para exibir o resultado da operação
        window.alert(`A soma de ${a} + ${b} é igual a ${c}`)
    </script>
    
</body>
</html>
