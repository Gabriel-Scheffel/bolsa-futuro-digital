<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: yellow;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20pt;
        }
    </style>
</head>
<body>
    <h1>Meu Site</h1>
    <main>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quod minus ducimus laudantium voluptatibus. Deserunt magni pariatur facilis, vel fugit temporibus soluta officiis incidunt maxime distinctio quis nulla nostrum, a aspernatur.</p>
    </main>

    <!-- O Script vem sempre ao final do body -->
    <script>
        // <-- comentário de uma linha em JavaScript
        // <-- comentário de múltiplas linhas --> 
        
        // window.alert cria uma janela com uma mensagem
        window.alert('Olá Mundo!')
        // window.confirm cria uma janela que pede uma confirmação
        window.confirm('Está gostando do JavaScript?')
        // window.prompt cria uma janela que pede uma resposta
        window.prompt('Qual o seu nome?')
    </script>
